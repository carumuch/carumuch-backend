# ============================================================
#                       사용 설명서
# ============================================================

# 코드레빗 공식 사용 설명서 링크
# https://docs.coderabbit.ai/overview/introduction




# ============================================================
#                   초기 언어 및 인터럭션 세팅
# ============================================================

# AI가 사용할 기본 언어를 설정 (ko-KR, en-US)
language: ko-KR

# AI의 페르소나 및 응답 지시 (최대 200자)
tone_instructions: >
  당신은 '카우머치 프로젝트'의 동료 개발자입니다.
  1. 피드백은 명확하고 구체적이어야 합니다.
  2. 문제의 원인과 개선 방법을 반드시 제시해주세요.
  3. 칭찬은 짧게 작성해주세요.
  
    


# ============================================================
#                       코드 리뷰 설정
# ============================================================
reviews:
  # 코드 리뷰의 강도 {chill(부드러운), assertive(엄격한)}
  profile: chill

  # =====================true설정목록===============================

  # CodeRabbit의 Approve 실행 여부 (치명적인 문제 발견 시 Approve를 하지 않습니다.)
  request_changes_workflow: true

  # PR의 템플릿 하단에 요약(summary) 생성 여부
  high_level_summary: true

  # 코드의 실행 흐름 시퀀스 다이어그램을 생성 여부 (리뷰어에게 괜찮은 지표가 되어 true)
  sequence_diagrams: true

  # PR에 연결된 이슈(Issue)를 분석하여 리뷰에 반영할지 여부
  assess_linked_issues: true

  # ====================false설정목록===============================

  # 변경된 각 파일에 대한 요약 생성 (PR 길어짐 방지로 false 진행)
  changed_files_summary: false

  # 연관된 다른 이슈를 찾아서 링크할지 여부
  related_issues: false

  # 연관된 다른 PR을 찾아서 링크할지 여부
  related_prs: false

  # PR에 적절한 레이블(bug, enhancement)을 추천할지 여부
  suggested_labels: false

  # 추천된 레이블을 자동으로 PR에 적용할지 여부
  auto_apply_labels: false

  # 해당 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부
  suggested_reviewers: false

  # 추천된 리뷰어를 자동으로 할당할지 여부
  auto_assign_reviewers: false

  # 리뷰에 시(poem)를 포함할지 여부입니다. (false 필수 입니다! true설정 시 코드레빗은 아름다운 시 한편을 작성합니다.)
  poem: false




  # ============================================================
  #              인트럭션 설정 (필요시 세팅 필요)
  # ============================================================
  # 특정 경로의 코드리뷰 설정
  # 최대 2,000자

#  path_instructions:
#    - path: src/**
#      instructions: |
#        1. 팀 및 공식 컨벤션(docs/carumuch-convention.md), 가독성, 예외처리, 테스트, 모듈화, API/DB/보안 설계 기준을 기반으로 리뷰해주세요.
#        2. 미작성한 테스트 코드 케이스가 있다면, 어떤 테스트가 필요한지 제안해주세요. (예: API 테스트, Service 단위 테스트, Repository 단위 테스트)

#    - path: src/test/java/**/*.java
#      instructions: |
#        1. 테스트코드의 컨벤션을 설정할 경우의 예시입니다.




  # ============================================================
  #                   자동 리뷰 설정
  # ============================================================
  auto_review:
    # PR이 생성 시 `@coderabbitai review`를 코멘트에 입력하면서 시작할지
    enabled: true
    # 이미 리뷰가 진행된 PR에 새로운 커밋이 추가될 때, 변경된 부분에 대해서 추가 리뷰를 진행할지 여부
    auto_incremental_review: true




# ============================================================
#                     채팅 기능 설정
# ============================================================
chat:
  # 사용자가 @coderabbitai 태그를 지정하지 않아도 자동으로 답글을 달 수 있도록 설정할지 여부
  auto_reply: true




# ============================================================
#                     CodeRabbit의 지식 설정
# ============================================================
knowledge_base:
  # 웹 검색을 통해 최신 정보나 문서를 참조할 수 있도록 허용할지 여부
  web_search:
    enabled: true