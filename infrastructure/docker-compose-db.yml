services:
  mysql:
    image: mysql:8.0.33
    container_name: carumuch-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-carumuch}
      MYSQL_USER: ${MYSQL_USER:-carumuch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-carumuch}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-carumuch}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: carumuch-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
