server:
  port: 8080

dev-host: https://hosting-not-yet

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    flyway:
      enabled: true

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  mail:
    #    host: smtp.naver.com
    host: smtp.${HOST_ADDRESS}
    port: 465
    username: ${MAIL_ADDRESS}
    password: ${MAIL_PASSWORD}
    address: ${MAIL_ADDRESS}@${HOST_ADDRESS}
    protocol: smtps
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  cloud:
    aws:
      credentials:
        accessKey: ${AWS_ACCESS_KEY}
        secretKey: ${AWS_SECRET_KEY}
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ap-northeast-2
      stack:
        auto: false
      cloudfront:
        domainName: ${AWS_CLOUDFRONT_DOMAIN}

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

jwt:
  access-secret-key: ${ACCESS_SECRET_KEY}
  refresh-secret-key: ${REFRESH_SECRET_KEY}
  verification-secret-key: ${VERIFICATION_SECRET_KEY}
  access-token-valid-days: 3
  refresh-token-valid-days: 30

cookie:
  name: CAR_U_MUCH

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info,metrics"
  endpoint:
    health:
      show-details: always

